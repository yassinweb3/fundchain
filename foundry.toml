[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.36"
evm_version = "osaka"
optimizer = false
via_ir = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.security.fuzz]
runs = 1000

[profile.security.invariant]
runs = 256
depth = 128
fail_on_revert = true
